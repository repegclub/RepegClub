      <stop offset="0%" stop-color="#fff4c2"/>
      <stop offset="55%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#b8811f"/>
    </radialGradient>
    <filter id="rpc-emboss" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0.55" dy="0.55" stdDeviation="0" flood-color="#5c3d0d" flood-opacity="0.9"/>
      <feDropShadow dx="-0.35" dy="-0.35" stdDeviation="0" flood-color="#fff8e0" flood-opacity="0.8"/>
