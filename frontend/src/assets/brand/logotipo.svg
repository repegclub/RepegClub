  <line x1="20" y1="1" x2="280" y2="1" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1"/>
  <text x="150" y="28" font-family="'Times New Roman', Georgia, 'Playfair Display', serif" font-size="30" letter-spacing="1.5" text-anchor="middle" fill="url(#rpc-gold)" filter="url(#rpc-emboss)">The Repeg Club</text>
  <line x1="20" y1="35" x2="280" y2="35" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1"/>
